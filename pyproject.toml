[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dupefind"
version = "1.0.0"
description = "Find duplicate files by content and see the reclaimable space. Report only: deletes nothing, writes a commented-out review script. No dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TPOALOS"}]
keywords = ["duplicate-files", "disk-space", "cleanup", "sha256", "sysadmin"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/TPOALOS/dupefind"

[project.scripts]
dupefind = "dupefind:main"

[tool.setuptools]
py-modules = ["dupefind"]
